name: Deploy Assets to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate index.html
        run: |
          # Find latest version
          latest_version=$(ls -v dist/main/ntg/ | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | tail -1)
          css_path="main/ntg/${latest_version}"

          # Generate directory listing
          cat > dist/index.html << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>NTG Web Design System Assets</title>
              <link rel="stylesheet" href="${css_path}/tokens.css">
              <link rel="stylesheet" href="${css_path}/index.css">
              <style>
                  body { font-family: var(--ntg-font-family-sans, system-ui, sans-serif); margin: 2rem; max-width: 800px; }
                  h1 { color: var(--ntg-color-primary-500, #0066cc); }
                  .version-info {
                      background: var(--ntg-color-surface-100, #f5f5f5);
                      padding: 1rem;
                      border-radius: var(--ntg-radius-md, 4px);
                      margin-bottom: 2rem;
                  }
                  ul { list-style: none; padding: 0; }
                  li { margin: 0.5rem 0; }
                  a { color: var(--ntg-color-primary-500, #0066cc); text-decoration: none; }
                  a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <h1>NTG Web Design System Assets</h1>
              <div class="version-info">
                  <strong>Latest version:</strong> ${latest_version}<br>
                  <strong>CSS loaded from:</strong> /${css_path}/
              </div>
              <h2>Directory Contents</h2>
              <ul>
          EOF

          # Add directory entries (excluding index.html)
          find dist -type f -not -name "index.html" -not -name ".nojekyll" | sed 's|^dist/||' | sort | while read -r file; do
              echo "                  <li><a href=\"$file\">$file</a></li>" >> dist/index.html
          done

          # Close HTML
          cat >> dist/index.html << 'EOF'
              </ul>
          </body>
          </html>
          EOF

      - name: Validate dist output
        run: |
          test -d dist
          test -f dist/index.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
